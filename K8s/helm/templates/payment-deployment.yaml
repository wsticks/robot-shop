apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    service: payment
    stage: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      service: payment
      stage: prod
  template:
    metadata:
      labels:
        service: payment
        stage: prod
    spec:
      {{ if .Values.psp.enabled }}
      serviceAccountName: robot-shop
      {{ end }}
      containers:
      - name: payment
        image: {{ if .Values.payment.image }}{{ .Values.payment.image }}{{ else }}{{ .Values.image.repo }}/rs-payment:{{ .Values.image.version }}{{ end }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if or .Values.payment.gateway .Values.payment.otel.enabled }}
        env:
          {{- if .Values.payment.gateway }}
          - name: PAYMENT_GATEWAY
            value: {{ .Values.payment.gateway | quote }}
          {{- end }}
          {{- if .Values.payment.otel.enabled }}
          - name: OTEL_SERVICE_NAME
            value: payment
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ .Values.payment.otel.endpoint | quote }}
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
          - name: OTEL_EXPORTER_OTLP_INSECURE
            value: "true"
          - name: OTEL_TRACES_EXPORTER
            value: otlp
          {{- end }}
        {{- end }}
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
      {{- with .Values.payment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.payment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.payment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
