# Registry and repository for Docker images
# Default is docker/robotshop/image:latest
image:
  repo: robotshop
  version: latest
  pullPolicy: IfNotPresent

# Instana end-user monitoring stays off. No agent is installed for this capstone.
eum:
  key: null
  url: ""

# Pod Security Policy
psp:
  enabled: false

# For the mini ones minikube, minishift set to true
nodeport: false

# "special" Openshift. Set to true when deploying to any openshift flavour
openshift: false

ocCreateRoute: false

######################################
# Affinities for individual workloads
# set in the following way:
# <workload>:
#   affinity: {}
#   nodeSelector: {}
#   tolerations: []
######################################

cart: {}

catalogue: {}

dispatch: {}

mongodb: {}

mysql: {}

payment:
  # Alternative payment gateway URL
  # Default is https://www.paypal.com
  gateway: null
  #gateway: https://www.worldpay.com
  # Set image to a full ref after you build payment/ with the tracing changes.
  # Leave it empty to use image.repo/rs-payment:image.version from Docker Hub.
  image: ""
  otel:
    enabled: false
    endpoint: http://otel-collector.observability.svc.cluster.local:4317

# Steady traffic. Off by default so a plain helm install does not start Locust.
loadgen:
  enabled: false
  clients: "5"

rabbitmq: {}

ratings: {}

redis:
  # Storage class to use with redis statefulset.
  storageClassName: standard

shipping: {}

user: {}

web: {}
