apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox
  namespace: observability
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          preferred_ip_protocol: ip4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox
  template:
    metadata:
      labels:
        app: blackbox
    spec:
      containers:
        - name: blackbox
          image: prom/blackbox-exporter:v0.25.0
          args: ["--config.file=/etc/blackbox/config.yml"]
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: blackbox
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox
  namespace: observability
spec:
  selector:
    app: blackbox
  ports:
    - name: http
      port: 9115
      targetPort: http
